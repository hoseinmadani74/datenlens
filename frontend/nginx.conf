# Redirect HTTP to HTTPS for datenlens.de and www.datenlens.de
server {
    listen 80;
    server_name datenlens.de www.datenlens.de;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Localhost HTTP fallback (for local development)
server {
    listen 80;
    server_name localhost 127.0.0.1;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:10000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS Server for datenlens.de
server {
    listen 443 ssl;
    server_name datenlens.de www.datenlens.de;

    ssl_certificate /etc/letsencrypt/live/datenlens.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datenlens.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:10000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

