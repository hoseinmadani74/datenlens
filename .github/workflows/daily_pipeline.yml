name: Daily PySpark Oil Data Pipeline

on:
  schedule:
    # Runs automatically every day at 01:00 UTC (Midnight in Germany)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub UI anytime!

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17 for PySpark
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyspark yfinance pandas

    - name: Run PySpark ETL Pipeline
      run: |
        python pipeline.py

    - name: Commit and Push Updated Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add oil_processed_data.json
        git diff-index --quiet HEAD || git commit -m "Automated daily PySpark oil data update [skip ci]"
        git push
