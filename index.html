<!-- CHART INITIALIZATION SCRIPT (FETCHES REAL PYSPARK DATA) -->
    <script>
        async function loadOilData() {
            try {
                // خواندن فایل خروجی پایتون/اسپارک
                const response = await fetch('oil_processed_data.json');
                const data = await response.json();

                // استخراج تاریخ‌ها، قیمت واقعی و میانگین متحرک
                const labels = data.map(item => item.date);
                const actualPrices = data.map(item => item.price);
                const sma7Prices = data.map(item => item.sma_7);

                // آپدیت کاردهای بالای صفحه با آخرین قیمت
                const lastItem = data[data.length - 1];
                document.getElementById('currentPrice').innerText = `$${lastItem.price} / bbl`;
                document.getElementById('sma7').innerText = `$${lastItem.sma_7}`;

                // رسم نمودار با داده‌های واقعی PySpark
                const ctx = document.getElementById('oilChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Real Oil Price ($)',
                                data: actualPrices,
                                borderColor: '#38bdf8',
                                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                                fill: true,
                                tension: 0.2
                            },
                            {
                                label: 'PySpark 7-Day SMA',
                                data: sma7Prices,
                                borderColor: '#a855f7',
                                borderDash: [5, 5],
                                tension: 0.2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } }
                        },
                        scales: {
                            x: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
                            y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
                        }
                    }
                });

            } catch (error) {
                console.error("Error loading oil data:", error);
            }
        }

        // اجرا هنگام باز شدن صفحه
        loadOilData();
    </script>
